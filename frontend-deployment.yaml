apiVersion: apps/v1
kind: Deployment
metadata:
  name: students-frontend
  labels:
    app: students
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: students
      tier: frontend
  template:
    metadata:
      labels:
        app: students
        tier: frontend
    spec:
      containers:
      - name: contenedor-students
        image: fronted-image
        ports:
          - name: http-front
            containerPort: 80
