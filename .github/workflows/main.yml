name: Docker Image CICD V2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  EKS_CLUSTER_NAME: mycluster
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout FIRST
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Setup Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3️⃣ Login Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4️⃣ Docker metadata
    - name: Docker Metadata
      id: docker_meta
      uses: docker/metadata-action@v5
      with:
        images: lanero/examen
        tags: |
          type=raw,value=frontTemp

    # 5️⃣ Build & Push
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    # 6️⃣ Configure AWS (ONLY on push to main)
    - name: Configure AWS credentials
      if: github.event_name == 'push'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 7️⃣ Update kubeconfig
    - name: Update kube config
      if: github.event_name == 'push'
      run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

    # 8️⃣ Deploy to EKS
    - name: Deploy to EKS
      if: github.event_name == 'push'
      run: kubectl apply -f frontend-deployment.yaml
